<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menu Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }
        .menu-btns {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 30px;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 250px;
            font-size: 20px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.94;
        }
        .btn-ejer1 {
            background-color: #a60da6;
        }
        .btn-ejer2 {
            background-color: #8cc61e;
    </style>
</head>
<body>
    <h1>Menu Principal</h1>
    <div class="menu-btns">
        <a href="/ejercicio1" class="btn btn-ejer1">Ejercicio 1</a>
        <a href="/ejercicio2" class="btn btn-ejer2">Ejercicio 2</a>
    </div>

</body>
</html>

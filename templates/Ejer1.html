<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculo de Compras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            background-color: #BFE2F2;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        .btn {
            display: block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Calculo de Compras</h2>
        <form action="/ejercicio1" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="0" required>

            <label for="tarros">Tarros:</label>
            <input type="number" id="tarros" name="tarros" min="1" required>

            <button type="submit" class="btn">Enviar</button>

        </form>

        {% if resultado %}
            <div class="resultado">
                <p>Nombre del cliente: {{ resultado.nombre }}</p>
                <p>Total sin descuento: ${{ resultado.total_sin_descuento }}</p>
                <p>El descuento es : ${{ resultado.monto_descuento }}</p>
                <p>El total a pagar es de : ${{ resultado.total_a_pagar }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
